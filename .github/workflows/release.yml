name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make test
      - name: Extract release notes
        # A beta tag has no section of its own yet: it ships what is under [Unreleased].
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in *-*) version=Unreleased ;; esac
          make release-notes VERSION="$version" > "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
